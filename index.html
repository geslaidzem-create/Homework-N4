<!DOCTYPE html>
<html lang="en" dir="Itr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>რეგისტრაცია</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
        <div class="title">რეგისტრაცია</div>
        <form action="#" id="registration-form">
            <div class="user-details">
                <div class="input-box">
                    <span class="details">სახელი</span>
                    <input type="text" name="firstname" placeholder="Enter your name" required>
                </div>
                <div class="input-box">
                    <span class="details">გვარი</span>
                    <input type="text" name="lastname" placeholder="Enter your  username" required>
                </div>
                <div class="input-box">
                    <span class="details">მეილი</span>
                    <input type="email" name="email" placeholder="Enter your Email" required>
                </div>
                <div class="input-box">
                    <span class="details">ტელეფონი</span>
                    <input type="tel" name="phone" placeholder="Enter your phone number" required>
                </div>
                <div class="input-box">
                    <span class="details">პაროლი</span>
                    <input type="password" name="password" placeholder="Enter your password" required>
                </div>
                <div class="input-box">
                    <span class="details">გაიმეორე პაროლი</span>
                    <input type="password" name="confirmPassword" placeholder="Confirm Password" required>
                </div>
            </div>
            <div class="gender-details">
                <input type="radio" name="gender" value="male" id="dot-1">
                <input type="radio" name="gender" value="femal" id="dot-2">
                <input type="radio" name="gender" value="other" id="dot-3">
                <span class="gender-title">სქესი</span>
                <div class="category">
                    <label for="dot-1">
                        <span class="dot one"></span>
                        <span class="gender">მამრობითი</span>
                    </label>
                    <label for="dot-2">
                        <span class="dot two"></span>
                        <span class="gender">მდედრობითი</span>
                    </label>
                    <label for="dot-3">
                        <span class="dot three"></span>
                        <span class="gender">სხვა</span>
                    </label>
                </div>
            </div>
            <div class="button">
                <input type="submit" value="რეგისტრაცია">
            </div>
        </form>
        </div>
        <script src="script.js"></script>
    </body>
</html>
